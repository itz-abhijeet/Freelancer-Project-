<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Time Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-bg: #f8fafc;
            --secondary-bg: #ffffff;
            --accent: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--primary-bg); }
        .card { @apply bg-white p-6 rounded-xl shadow-lg border border-gray-100; }
        .btn-primary { @apply bg-accent text-white px-4 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition duration-150; }
        .input-field { @apply mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-accent focus:border-accent; }
        .filter-btn { @apply px-4 py-2 rounded-full font-medium transition duration-150; }
        #toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 1000; display: flex; flex-direction: column; gap: 0.5rem; }
        .bg-success { background-color: var(--success); }
        .bg-danger { background-color: var(--danger); }
        .bg-accent { background-color: var(--accent); }
        .text-accent { color: var(--accent); }
        .text-success { color: var(--success); }
        .text-primary-bg { color: var(--primary-bg); }
        .text-danger { color: var(--danger); }
        .table-wrapper { overflow-x: auto; }
        /* Responsive Table Styling (adapted from previous JS logic) */
        @media (max-width: 768px) {
            #projects-table thead { display: none; }
            #projects-table tbody tr { display: block; margin-bottom: 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; }
            #projects-table td { display: flex; justify-content: space-between; padding: 0.75rem; border-bottom: 1px solid #f3f4f6; text-align: right; }
            #projects-table td:before { content: attr(data-label); font-weight: 600; text-align: left; flex-basis: 50%; color: #6b7280; }
            #projects-table td:last-child { border-bottom: none; }
            #projects-table td:nth-child(1) { font-weight: bold; }
        }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    <div class="min-h-screen flex flex-col">
        <header class="bg-white shadow-md">
            <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-accent">ProManager Time Tracker</h1>
                <div class="space-x-4 flex items-center">
                    <button id="add-project-btn" class="btn-primary flex items-center space-x-1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                        <span>New Project</span>
                    </button>
                    <a href="{{ url_for('setup_db') }}" class="text-sm bg-red-100 text-red-600 px-3 py-1 rounded-full hover:bg-red-200">DB Setup</a>
                </div>
            </nav>
        </header>

        <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" id="summary-cards">
                <div class="card bg-white border-accent cursor-pointer border-l-4 p-4 hover:shadow-lg transition filter-btn" data-filter="All">
                    <p class="text-sm font-medium text-gray-500">Total Projects</p>
                    <p id="total-projects-count" class="text-3xl font-extrabold text-gray-900 mt-1">0</p>
                </div>
                <div class="card bg-white border-yellow-500 cursor-pointer border-l-4 p-4 hover:shadow-lg transition filter-btn" data-filter="Active">
                    <p class="text-sm font-medium text-gray-500">Active Earnings Due</p>
                    <p id="total-pending" class="text-3xl font-extrabold text-yellow-500 mt-1">₹0.00</p>
                </div>
                <div class="card bg-white border-success cursor-pointer border-l-4 p-4 hover:shadow-lg transition filter-btn" data-filter="Hourly">
                    <p class="text-sm font-medium text-gray-500">Total Time Logged</p>
                    <p id="total-time-logged" class="text-3xl font-extrabold text-success mt-1">0h 0m</p>
                </div>
            </div>

            <p id="user-info" class="text-center text-sm text-gray-500 mb-6"></p>

            <!-- Projects Table -->
            <div class="table-wrapper">
                <div class="shadow overflow-hidden border-b border-gray-200 sm:rounded-lg">
                    <table class="min-w-full divide-y divide-gray-200" id="projects-table">
                        <thead class="bg-gray-50 hidden md:table-header-group">
                            <tr>
                                <th scope="col" class="px-2 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Project / Client</th>
                                <th scope="col" class="px-2 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rate</th>
                                <th scope="col" class="px-2 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total Due</th>
                                <th scope="col" class="px-2 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Time Logged</th>
                                <th scope="col" class="px-2 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th scope="col" class="px-2 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="projects-list">
                            <!-- Project rows will be inserted here by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer class="bg-gray-800 text-white p-4 text-center text-sm mt-8">
            Flask & MySQL Time Tracking Application
        </footer>
    </div>

    <!-- Project Modal -->
    <div id="project-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-75 overflow-y-auto h-full w-full z-50 transition duration-300 items-center justify-center">
        <div class="relative p-8 w-full max-w-lg mx-auto bg-white rounded-xl shadow-2xl transform scale-95 transition-all" onclick="event.stopPropagation()">
            <h3 id="modal-title" class="text-2xl font-bold text-gray-900 mb-4">Add New Project</h3>
            <form id="project-form">
                <input type="hidden" id="project-id" name="project-id">

                <div class="mb-4">
                    <label for="name" class="block text-sm font-medium text-gray-700">Project Name</label>
                    <input type="text" id="name" name="name" class="input-field" required>
                </div>

                <div class="mb-4">
                    <label for="client_id" class="block text-sm font-medium text-gray-700">Client</label>
                    <select id="client_id" name="client_id" class="input-field" required>
                        <option value="">Select Client</option>
                        {% for client in clients %}
                            <option value="{{ client.id }}">{{ client.Name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Rate Type</label>
                    <div class="mt-2 flex space-x-4 rate-type-toggle">
                        <label class="inline-flex items-center">
                            <input type="radio" name="rateType" id="rateTypeHourly" value="Hourly" class="form-radio text-accent" checked>
                            <span class="ml-2 text-gray-700">Hourly</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="rateType" id="rateTypeFixed" value="Fixed" class="form-radio text-accent">
                            <span class="ml-2 text-gray-700">Fixed</span>
                        </label>
                    </div>
                </div>

                <div class="mb-6">
                    <label for="rateValue" class="block text-sm font-medium text-gray-700" id="rateValueLabel">Hourly Rate (₹/hr)</label>
                    <input type="number" step="0.01" id="rateValue" name="rateValue" class="input-field" required min="0.01">
                </div>

                <div class="flex justify-end space-x-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-600 bg-gray-200 rounded-lg hover:bg-gray-300 transition">Cancel</button>
                    <button type="submit" class="btn-primary">Save Project</button>
                </div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
